name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (Linux + Windows)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: server/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Build Linux
        working-directory: server/cmd/desktop
        run: wails build -tags webkit2_41 -skipbindings

      - name: Build Windows
        working-directory: server/cmd/desktop
        run: wails build -platform windows/amd64 -skipbindings -s

      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp server/cmd/desktop/build/bin/rolboard AppDir/usr/bin/
          cp server/cmd/desktop/build/appicon.png AppDir/rolboard.png
          cat > AppDir/rolboard.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Rolboard
          Comment=Tabletop RPG campaign manager
          Exec=rolboard
          Icon=rolboard
          Categories=Game;RolePlaying;
          StartupWMClass=rolboard
          EOF
          ln -s usr/bin/rolboard AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir rolboard-linux-x86_64.AppImage

      - name: Collect artifacts
        run: |
          mkdir dist
          mv rolboard-linux-x86_64.AppImage dist/
          mv server/cmd/desktop/build/bin/rolboard.exe dist/rolboard-windows-amd64.exe

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: rolboard-desktop
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
