name: Bug report
description: Something doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check the [open issues](https://github.com/ncorrea-13/rolboard/issues) first; if yours is already there, add your case to it. Spanish is fine too.

        For security issues, don't open an issue: follow [SECURITY.md](https://github.com/ncorrea-13/rolboard/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a campaign
        2. Go to NPCs
        3. ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Rolboard?
      options:
        - Desktop app (Windows)
        - Desktop app (Linux AppImage)
        - Docker / Podman
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag (e.g. v0.1.0) or commit for Docker images.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Debian 13, Ubuntu 24.04...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server or terminal output, browser console errors, screenshots. Remove anything private from your campaign.
      render: shell
