plugins {
    id "com.android.application"
}

android {
    namespace "io.github.ncorrea_13.rolboard"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.ncorrea_13.rolboard"
        minSdk 26
        targetSdk 36
        versionCode = (findProperty("versionCode") ?: "1") as int
        versionName = findProperty("versionName") ?: "0.0.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            def keystore = System.getenv("ANDROID_KEYSTORE_FILE")
            storeFile = keystore ? file(keystore) : null
            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias = "rolboard"
            keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files("libs/rolboard.aar")
}
