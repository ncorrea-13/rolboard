version: "3.8"

services:
  server:
    build: ./server
    env_file:
      - .env
    volumes:
      - campaign_data:/data
      - ${VAULTS_ROOT_HOST}:/vaults:ro
    environment:
      DB_PATH: /data/campaign.db
      VAULTS_ROOT: /vaults
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "${PORT}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  campaign_data:
    driver: local
