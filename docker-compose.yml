services:
  rolboard-server:
    build: ./server
    env_file:
      - .env
    volumes:
      - campaign_data:/data
      - ${VAULTS_ROOT_HOST}:/vaults:ro
    environment:
      DB_PATH: /data/campaign.db
      VAULTS_ROOT: /vaults
      PORT: 8080
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - rolboard-server
    restart: unless-stopped

volumes:
  campaign_data:
    driver: local
